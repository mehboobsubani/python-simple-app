name: Build and publish image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: mehb786/python-simple-app
  CHART_REGISTRY: oci://registry-1.docker.io/mehb786

jobs:
  build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, 'Update Python application image') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./application
          push: true
          tags: ${{ env.IMAGE_NAME }}:v1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to Docker Hub for OCI charts
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" |
            helm registry login registry-1.docker.io \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

      - name: Package and push Helm charts
        env:
          CHART_VERSION: 0.1.${{ github.run_number }}
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm dependency build helm/lgtm
          helm package helm/python-simple-app --version "$CHART_VERSION"
          helm package helm/lgtm --version "$CHART_VERSION"
          helm push "python-simple-app-${CHART_VERSION}.tgz" "$CHART_REGISTRY"
          helm push "lgtm-${CHART_VERSION}.tgz" "$CHART_REGISTRY"
          echo "Published ${IMAGE_NAME}:v1.0.${{ github.run_number }}"
          echo "Published OCI charts with version ${CHART_VERSION}"
