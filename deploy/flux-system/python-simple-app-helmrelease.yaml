apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: python-simple-app
  namespace: python-simple-app
spec:
  interval: 5m
  chart:
    spec:
      chart: python-simple-app
      version: ">=0.1.0"
      sourceRef:
        kind: HelmRepository
        name: dockerhub-charts
        namespace: flux-system
  values:
    image:
      repository: mehb786/python-simple-app
      tag: v1.0.0
      pullPolicy: IfNotPresent
    replicaCount: 1
    ingress:
      enabled: true
    otel:
      endpoint: http://alloy.observability.svc.cluster.local:4317
