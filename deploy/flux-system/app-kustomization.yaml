apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: python-simple-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/flux/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: python-simple-app
  dependsOn:
    - name: python-simple-app-observability
  wait: true
  timeout: 5m
