apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-simple-app
  labels:
    app.kubernetes.io/name: python-simple-app
    app.kubernetes.io/component: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: python-simple-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-simple-app
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: python-simple-app
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/example/python-simple-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
            - name: grpc
              containerPort: 50051
          env:
            - name: HTTP_PORT
              value: "5000"
            - name: GRPC_PORT
              value: "50051"
            - name: OTEL_SERVICE_NAME
              value: python-simple-app
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
