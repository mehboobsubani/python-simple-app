apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: observability
spec:
  interval: 10m
  chart:
    spec:
      chart: mimir-distributed
      version: ">=5.0.0 <6.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    minio:
      enabled: false
    alertmanager:
      enabled: false
    ruler:
      enabled: false
    nginx:
      enabled: true
      service:
        type: NodePort
        nodePort: 30300
    distributor:
      replicas: 1
    ingester:
      replicas: 1
      zoneAwareReplication:
        enabled: false
    querier:
      replicas: 1
    query_frontend:
      replicas: 1
    query_scheduler:
      replicas: 1
    store_gateway:
      replicas: 1
      zoneAwareReplication:
        enabled: false
    compactor:
      replicas: 1
    memcached:
      enabled: false
    memcachedExporter:
      enabled: false
    resultsCache:
      enabled: false
    chunksCache:
      enabled: false
    overrides_exporter:
      enabled: false
    mimir:
      structuredConfig:
        multitenancy_enabled: false
        ingester:
          ring:
            replication_factor: 1
        common:
          storage:
            backend: filesystem
        blocks_storage:
          backend: filesystem
          filesystem:
            dir: /data/blocks
        compactor:
          data_dir: /data/compactor
        ruler:
          rule_path: /data/ruler
        store_gateway:
          sharding_ring:
            replication_factor: 1
