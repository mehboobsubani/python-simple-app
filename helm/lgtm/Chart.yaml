apiVersion: v2
name: lgtm
description: Grafana LGTM stack with Alloy for local observability
type: application
version: 0.1.0
appVersion: "1.0"
dependencies:
  - name: grafana
    version: 9.4.5
    repository: https://grafana.github.io/helm-charts
  - name: loki
    version: 6.55.0
    repository: https://grafana.github.io/helm-charts
  - name: tempo
    version: 1.24.4
    repository: https://grafana.github.io/helm-charts
  - name: mimir-distributed
    alias: mimir
    version: 5.8.0
    repository: https://grafana.github.io/helm-charts
  - name: alloy
    version: 0.12.6
    repository: https://grafana.github.io/helm-charts
